name: CI

on:
  push:
    branches: [gnome, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The JavaScript checks shell out to node, which parses the same ESM
      # grammar GJS does. Without it those tests skip and a syntax error in the
      # extension reaches a release.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: pip install pytest

      - name: Tests
        run: python -m pytest -q

      # These execute extension code rather than reading it, so a failure here
      # is a real behavioural regression, not a naming one.
      - name: JavaScript unit tests
        run: node --test tests/js/

      - name: The JavaScript checks actually ran
        # A skip here is indistinguishable from a pass in the summary, and the
        # whole point of them is that nothing else covers the extension.
        run: |
          python -m pytest -q tests/test_extension_syntax.py -rs 2>&1 | tee out.txt
          grep -q "skipped" out.txt && { echo "node checks were skipped"; exit 1; } || true

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install into a scratch home
        # systemd is not available on a runner, and the daemon is started by the
        # step below instead.
        env:
          POKETOKENBAR_NO_SERVICE: '1'
          POKETOKENBAR_UI: gnome
        run: ./install.sh
      - name: The daemon runs and writes a state file
        run: |
          PYTHONPATH="$HOME/.local/share/poketokenbar/app" \
            "$HOME/.local/share/poketokenbar/venv/bin/python" - <<'PY'
          from pathlib import Path
          from poketokenbar import config, providers, state
          from poketokenbar.daemon import Daemon

          daemon = Daemon(state_path=state.default_path(),
                          config_path=config.default_path(),
                          cache=None, providers=[])
          daemon.providers = providers.build(custom_roots=daemon.custom_scan_roots)
          state.write(daemon.state_path, daemon.poll_once())
          written = Path(state.default_path())
          assert written.is_file(), "the daemon wrote no state file"
          print(f"wrote {written} ({written.stat().st_size} bytes)")
          PY
      - name: poketokenctl works
        run: |
          "$HOME/.local/bin/poketokenctl" refresh
          "$HOME/.local/bin/poketokenctl" scan-roots gemini /tmp/example
          cat "$HOME/.config/poketokenbar/config.json"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pytest PySide6-Essentials

      # The whole suite, on the platform itself. platform_paths injects the
      # system so all three mappings are checked from anywhere, but only here
      # is the real one exercised.
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

      - name: The daemon resolves its paths under the user profile
        run: python tools/windows_check_paths.py

      # The point of the whole port: real log files on a real Windows
      # filesystem, read by the same parsers, aggregated into a real state.json.
      - name: One poll, end to end
        run: python tools/windows_check_poll.py

      - name: The tray application constructs
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/windows_check_tray.py

      - name: The installer parses under the PowerShell that will run it
        shell: pwsh
        run: |
          $errs = $null
          foreach ($f in @('packaging/windows/install.ps1', 'packaging/windows/uninstall.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $f), [ref]$null, [ref]$errs) | Out-Null
            if ($errs.Count) { $errs; exit 1 }
            Write-Host "$f OK"
          }
